<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5/700.css">

<style>
/* ================================================================
   D7 — THE PERIODICAL / VERSION Nº 001
   Newsmagazine portfolio: masthead, cover plate, features, colophon
   ================================================================ */
*,*::before,*::after{box-sizing:border-box;}
:root{
  --font-serif:'Fraunces','Georgia','Times New Roman',Georgia,serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Courier New',monospace;
}
:root,:root[data-v="a"]{
  --bg:#E4E5E3;--panel:#DCDEDD;--hairline:rgba(24,22,20,0.18);
  --ink:#1B1916;--dim:#5B5650;--accent:#B5241B;--accent-ink:#8E1710;
  color-scheme:light;
}
:root[data-v="b"]{
  --bg:#19151B;--panel:#221D25;--hairline:rgba(241,236,226,0.15);
  --ink:#F1ECE2;--dim:#8E8578;--accent:#E0352E;--accent-ink:#F0705A;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:400 17px/1.72 var(--font-serif);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
.mono{
  font-family:var(--font-mono);font-size:11px;
  letter-spacing:0.13em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;
}
.vh{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);
  white-space:nowrap;border:0;
}
a{color:inherit;text-decoration:none;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
::selection{background:rgba(198,67,31,0.22);color:var(--ink);}
:root[data-v="b"] ::selection{background:rgba(255,85,51,0.28);color:var(--ink);}
.lnk{
  position:relative;display:inline-flex;align-items:center;
  min-height:44px;gap:6px;
}
.lnk::after{
  content:"";position:absolute;left:0;right:0;bottom:6px;
  height:1px;background:var(--accent);
  transform:scaleX(0);transform-origin:0 50%;
  transition:transform 200ms ease;
}
.lnk:hover::after,.lnk:focus-visible::after{transform:scaleX(1);}

/* ---- HERO ---- */
.hero{
  position:relative;height:100vh;height:100svh;
  background:var(--bg);display:flex;flex-direction:column;overflow:hidden;
}
/* page corner ticks: hidden on desktop, frame the whole body on mobile */
.page-tick{display:none;}
.masthead{
  display:flex;justify-content:space-between;align-items:center;
  padding:0 clamp(20px,4vw,52px);height:48px;flex-shrink:0;
  border-bottom:1px solid var(--hairline);
}
.masthead-brand{
  font-family:var(--font-serif);font-size:14px;font-weight:700;
  letter-spacing:0.14em;text-transform:uppercase;
}
.masthead-meta{display:flex;gap:clamp(12px,2.5vw,32px);flex-wrap:wrap;}
.cover-area{
  flex:1;min-height:0;display:grid;
  grid-template-columns:minmax(0,44fr) minmax(0,56fr);
  padding:clamp(14px,2vh,28px) clamp(20px,4vw,52px) clamp(10px,1.5vh,20px);
  gap:0;
}
.cover-lockup{
  display:flex;flex-direction:column;justify-content:center;
  padding-right:clamp(16px,2.5vw,36px);
  border-right:1px solid var(--hairline);
  gap:0;
}
.cover-overline{margin:0 0 clamp(8px,1.2vh,18px);color:var(--dim);}
.cover-name{
  margin:0 0 clamp(6px,1vh,14px);
  font-family:var(--font-serif);
  font-size:clamp(3rem,7vw,6rem);
  font-weight:700;font-style:italic;
  line-height:0.88;letter-spacing:-0.015em; }
.cover-name>span{display:block;}
.cover-hr{
  width:2.4em;height:2px;background:var(--accent);
  border:none;margin:clamp(6px,1.1vh,16px) 0;flex-shrink:0;
}
.cover-role{
  margin:0 0 2px;
  font-family:var(--font-serif);
  font-size:clamp(0.9rem,1.3vw,1.05rem);
  font-weight:500;
}
.cover-loc{margin:0 0 clamp(8px,1.4vh,20px);color:var(--dim);}
.cover-links{display:flex;flex-direction:column;gap:0;}
.cover-links .lnk{min-height:36px;font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;}
.cover-corr{
  display:inline-block;color:var(--dim);margin-top:clamp(4px,0.8vh,12px);
  text-decoration:none;position:relative;
  transition:color 200ms ease;
}
.cover-corr::after{
  content:"";position:absolute;left:0;right:0;bottom:-2px;
  height:1px;background:var(--accent);
  transform:scaleX(0);transform-origin:0 50%;
  transition:transform 200ms ease;
}
.cover-corr:hover,.cover-corr:focus-visible{color:var(--ink);}
.cover-corr:hover::after,.cover-corr:focus-visible::after{transform:scaleX(1);}
.cover-plate-col{
  display:flex;flex-direction:column;
  padding-left:clamp(16px,2.5vw,36px);
}
.plate-frame{
  flex:1;min-height:0;position:relative;
  border:1px solid var(--hairline);
  overflow:hidden;background:var(--panel);
}
.plate-tick{
  position:absolute;background:var(--accent);
  width:6px;height:6px;z-index:3;
}
.plate-tick--tl{top:0;left:0;}
.plate-tick--tr{top:0;right:0;}
.plate-tick--bl{bottom:0;left:0;}
.plate-tick--br{bottom:0;right:0;}
.plate-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;
}
.plate-canvas[aria-hidden="true"]{pointer-events:none;}
.plate-fallback{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse at 30% 35%,color-mix(in srgb,var(--accent) 32%,var(--panel)) 0%,transparent 55%),
    radial-gradient(ellipse at 75% 68%,color-mix(in srgb,var(--accent) 18%,var(--panel)) 0%,transparent 52%),
    var(--panel);
}
.plate-frame.has-webgl .plate-fallback{display:none;}
.plate-caption{margin-top:8px;color:var(--dim);flex-shrink:0;}

/* ---- SECTIONS ---- */
main{display:block;}
.wrap{width:min(100% - clamp(40px,8vw,104px),1440px);margin-inline:auto;}
.section{padding-top:clamp(52px,8vh,88px);}
.sec-running{
  display:flex;justify-content:space-between;
  color:var(--dim);margin-bottom:7px;
}
.sec-head{
  display:flex;align-items:flex-end;gap:16px;
  padding-bottom:12px;
  border-bottom:1px solid var(--hairline);
  margin-bottom:clamp(26px,4.5vh,48px);
}
.sec-idx{
  font-family:var(--font-serif);font-style:italic;
  font-size:clamp(2.8rem,4.5vw,4rem);
  font-weight:700;line-height:0.88;color:var(--dim);flex-shrink:0;
}
.sec-label{display:flex;flex-direction:column;flex:1;min-width:0;gap:2px;}
.sec-kicker{color:var(--dim);}
.sec-title{
  margin:0;font-family:var(--font-serif);
  font-size:clamp(1.2rem,1.9vw,1.55rem);
  font-weight:600;letter-spacing:-0.01em;line-height:1.1;
}
.sec-rule{flex:1;height:1px;background:var(--hairline);align-self:center;margin-left:6px;}
.sec-folio{color:var(--dim);flex-shrink:0;}

/* about */
.about-text{
  margin:0;
  column-count:2;column-gap:clamp(28px,4.5vw,56px);
  max-width:94ch;font-size:1rem;line-height:1.78;
}
.about-text::first-letter{
  font-family:var(--font-serif);font-size:4.6em;font-weight:700;font-style:italic;
  float:left;line-height:0.72;margin:0.06em 0.1em 0 0;color:var(--ink);
}

/* experience */
.jobs{border-top:1px solid var(--hairline);}
.job{
  display:grid;
  grid-template-columns:clamp(120px,14vw,180px) 1fr 1fr;
  column-gap:clamp(16px,2.5vw,32px);
  row-gap:8px;padding:28px 0;
  border-bottom:1px solid var(--hairline);
}
.job-period{color:var(--dim);}
.job-loc-sub{display:block;margin-top:3px;color:var(--dim);}
.job-co{
  font-family:var(--font-serif);
  font-size:clamp(1rem,1.6vw,1.25rem);
  font-weight:600;margin:0 0 2px;
}
.job-role-line{color:var(--dim);margin:0 0 6px;}
.job-note-cell{margin:0;font-size:0.95rem;line-height:1.68;color:var(--dim);}
.job-stack{margin:6px 0 0;color:var(--dim);font-size:0.85rem;}
.job-tag{
  display:inline-block;padding:1px 7px;
  border:1px solid var(--hairline);
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:0.09em;text-transform:uppercase;
  color:var(--dim);margin:2px 2px 0 0;
}

/* projects / plates */
.plates{display:flex;flex-direction:column;gap:0;}
.plate-entry{
  display:grid;
  grid-template-columns:1fr 1fr;
  column-gap:clamp(16px,2.5vw,40px);
  row-gap:0;
  padding:clamp(32px,5vh,56px) 0;
  border-bottom:1px solid var(--hairline);
  align-items:start;
}
.plate-entry:first-child{border-top:1px solid var(--hairline);}
.plate-visual{
  position:relative;aspect-ratio:4/3;
  border:1px solid var(--hairline);
  overflow:hidden;background:var(--panel);
  display:flex;align-items:flex-end;
}
.plate-visual-bg{
  position:absolute;inset:0;
  background:var(--panel);
}
.plate-video{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
  background:var(--panel);
}
/* a plate that carries a video hugs the film's own proportions (2146:1890) */
.plate-entry:has(.plate-video) .plate-visual{aspect-ratio:1.135/1;}
.plate-fig-caption{
  position:relative;z-index:1;
  width:100%;padding:8px 10px;
  background:rgba(27,25,22,0.75);
  color:rgba(241,236,226,0.85);
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:0.12em;text-transform:uppercase;
}
:root[data-v="b"] .plate-fig-caption{background:rgba(10,8,12,0.65);}
.plate-body{
  display:flex;flex-direction:column;justify-content:center;
  padding:4px 0;
}
.plate-num{
  font-family:var(--font-serif);font-style:italic;
  font-size:clamp(2rem,3vw,2.8rem);
  font-weight:700;color:var(--dim);
  margin:0 0 6px;line-height:1;
}
.plate-name{
  margin:0 0 6px;
  font-family:var(--font-serif);
  font-size:clamp(1.3rem,2.1vw,1.75rem);
  font-weight:600;letter-spacing:-0.01em;line-height:1.1;
}
.plate-note{margin:0 0 12px;font-size:0.95rem;line-height:1.7;color:var(--dim);max-width:52ch;}
.plate-tags{margin:0;display:flex;flex-wrap:wrap;gap:4px;}
.plate-tag{
  list-style:none;
  padding:2px 9px;border:1px solid var(--hairline);
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:0.09em;text-transform:uppercase;color:var(--dim);
}

/* skills / index */
.index-cats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:clamp(28px,4vw,48px) clamp(20px,3vw,36px);
}
.idx-cat-head{
  margin:0 0 10px;
  font-family:var(--font-serif);font-size:0.8rem;
  font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--accent-ink);
  padding-bottom:8px;border-bottom:1px solid var(--hairline);
}
.idx-entries{list-style:none;margin:0;padding:0;}
.idx-entry{
  display:flex;align-items:baseline;
  padding:5px 0;border-bottom:1px solid var(--hairline);
  font-size:0.95rem;line-height:1.5;
}
.idx-word{flex:1;padding-right:6px;}
.idx-leader{
  flex:1;border-bottom:1px dotted var(--hairline);
  margin:0 6px 3px;min-width:20px;
}
.idx-page{color:var(--dim);flex-shrink:0;font-family:var(--font-mono);font-size:10px;}

/* contact / colophon */
.colophon-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(24px,4vw,52px);
}
.colophon-facts{border-top:1px solid var(--hairline);padding-top:16px;}
.colophon-fact{
  display:flex;gap:14px;padding:10px 0;
  border-bottom:1px solid var(--hairline);
  font-size:0.9rem;line-height:1.5;
}
.colophon-fact-label{flex:0 0 clamp(80px,9vw,110px);color:var(--dim);}
.colophon-email{
  font-family:var(--font-serif);font-style:italic;
  font-size:clamp(1.4rem,3vw,2.4rem);
  font-weight:600;line-height:1.2;
  margin:0 0 18px;overflow-wrap:anywhere;word-break:break-word;
}
.colophon-links{display:flex;flex-direction:column;gap:0;margin:0 0 18px;}
.colophon-links .lnk{font-family:var(--font-mono);font-size:11px;letter-spacing:0.1em;}
.colophon-edu{
  font-size:0.85rem;line-height:1.6;color:var(--dim);
  margin:0;padding-top:16px;border-top:1px solid var(--hairline);
}

/* footer */
.page-footer{
  padding:clamp(24px,4vh,48px) 0 clamp(20px,3vh,36px);
  margin-top:clamp(40px,6vh,72px);
}
.footer-rule{
  border:none;border-top:1px solid var(--hairline);
  margin:0 0 18px;
}
.footer-row{
  display:flex;justify-content:space-between;flex-wrap:wrap;
  gap:8px 20px;color:var(--dim);
}

/* ---- MOBILE ---- */
@media (max-width:760px){
  /* the whole page becomes the plate on mobile: hairline frame + orange corner ticks */
  body{position:relative;border:1px solid var(--hairline);}
  .page-tick{
    display:block;position:absolute;background:var(--accent);
    width:6px;height:6px;z-index:3;
  }
  .page-tick--tl{top:0;left:0;}
  .page-tick--tr{top:0;right:0;}
  .page-tick--bl{bottom:0;left:0;}
  .page-tick--br{bottom:0;right:0;}
  .hero{height:auto;}
  .cover-area{
    grid-template-columns:1fr;
    padding-bottom:16px;
    overflow:hidden;
  }
  .cover-lockup{
    border-right:none;border-bottom:1px solid var(--hairline);
    padding-right:0;padding-bottom:clamp(12px,2vh,20px);
    order:1;
  }
  .cover-plate-col{
    display:none;
  }
  .plate-frame{aspect-ratio:16/9;flex:none;}
  .wrap{width:calc(100% - 40px);}
  .about-text{column-count:1;}
  .job{grid-template-columns:1fr;row-gap:8px;padding:24px 0;}
  .plate-entry{grid-template-columns:1fr;row-gap:16px;padding:28px 0;}
  .plate-visual{aspect-ratio:16/9;}
  .plate-entry:has(.plate-video) .plate-visual{aspect-ratio:1.135/1;}
  .index-cats{grid-template-columns:1fr 1fr;}
  .colophon-grid{grid-template-columns:1fr;}
  .masthead-meta .mono:last-child{display:none;}
  .sec-rule{display:none;}
  .sec-folio{display:none;}
  .cover-name{font-size:clamp(2.2rem,9vw,3.5rem);}
}
@media (max-width:480px){
  .index-cats{grid-template-columns:1fr;}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none !important;animation:none !important;}
}
/* still the autoplaying plate video under reduced-motion preference */
@media (prefers-reduced-motion:reduce){
  .plate-video{display:none;}
}
/* visitors without WebGL2 never see the cover plate: the lockup takes the full column */
.no-webgl .cover-plate-col{display:none;}
.no-webgl .cover-area{grid-template-columns:1fr;}
.no-webgl .cover-lockup{border-right:none;padding-right:0;}
</style>
<script>
/* if WebGL2 is unavailable, hide the WebGL cover plate entirely */
(function(){
  var c = document.createElement('canvas');
  var ok = !!(window.WebGL2RenderingContext && c.getContext('webgl2'));
  if (!ok) document.documentElement.classList.add('no-webgl');
})();
</script>
</head>

/* ================================================================
   WebGL2 cover plate — STATIC: the single cover image (Fig. 02) is
   drawn once through the shader with the resting vignette and film
   grain. No carousel, no rotation, no fade, no loop. Falls back to
   a procedural Truchet stub cover if the image never loads.
   ================================================================ */
const VERT = `#version 300 es
layout(location=0) in vec2 aPos;
out vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

/* ================================================================
   COVER PLATE — SIGNAL LATTICE

   The lattice is a wire graph: every cell carries one of four wire
   pieces, and each piece joins two of the cell's four edge midpoints.

     VERT   N-S          HORZ   E-W
     TRU_A  N-E, W-S     TRU_B  N-W, E-S   (quarter arcs, r = 1/2 cell)

   A woven block of Truchet cells sits at the centre; outside it the
   wires comb straight out to the plate border. JS owns the grid and
   the traversal, so a spark follows the true path through the graph;
   the shader is only a renderer, reading the grid from a texture.
   ================================================================ */

const EMPTY = 0, VERT_C = 1, HORZ_C = 2, TRU_A = 3, TRU_B = 4;
/* edges: 0=N 1=E 2=S 3=W. PAIR[code][edge] -> the edge it joins to */
const PAIR = {
  [VERT_C]: [2, -1, 0, -1],
  [HORZ_C]: [-1, 3, -1, 1],
  [TRU_A]:  [1, 0, 3, 2],
  [TRU_B]:  [3, 2, 1, 0]
};
const MIDPT = [[0.5, 1], [1, 0.5], [0.5, 0], [0, 0.5]];  /* edge midpoints, cell-local */
const STEP_D = [[0, 1], [1, 0], [0, -1], [-1, 0]];        /* N E S W */
const ARC_LEN = Math.PI / 4;   /* quarter arc of radius 1/2 */

/* Density is measured off the source plate: 40px pitch with a 4px stroke,
   so stroke/pitch = 0.10 (w = 0.05 half-width) and ~40 wires across the
   short side. On a narrow hero column that many wires would drive the
   stroke under a device pixel and shimmer, so the count backs off to hold
   a minimum pitch — full density where there is room, never aliased. */
const CELLS_MAX = 80;      /* wires across the plate's short side */
const PITCH_MIN = 4.5;     /* CSS px per cell, the floor before backing off */
const CELLS_MIN = 14;
const BLOCK = 0.29;        /* woven block half-extent, as a fraction of cells */
const SPARKS = 3;
const TRAIL = 14;          /* samples per spark tail */

/* Spark tuning is expressed in cell units, so it is rescaled whenever the
   density changes — otherwise a denser grid silently halves the apparent
   speed, shortens the tail and shrinks the glow. Baseline is 22 wires. */
/* turns per second per 1000 woven cells: rate is normalised to the size of
   the block so a denser weave keeps the same visible rate of reconfiguration */
const FLIP_RATE = 5.6;
let cellCount = CELLS_MAX, scale = 1, TRAIL_STEP = 0.18, SPEED = 3.1, GLOW = 7;
let flipRate = 1;
function setDensity(pxW, pxH) {
  cellCount = Math.max(CELLS_MIN,
              Math.min(CELLS_MAX, Math.floor(Math.min(pxW, pxH) / PITCH_MIN)));
  scale = cellCount / 22;
  TRAIL_STEP = 0.18 * scale;
  SPEED = 3.1 * scale;
  GLOW = 7 / (scale * scale);
}
const FLIPS = 8;       /* cells allowed to be mid-turn at once */
const FLIP_TIME = 0.55;

const FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform vec2 uRes;
uniform vec2 uGrid;
uniform float uTime;
uniform sampler2D uCells;
uniform vec3 uTrail[${SPARKS * TRAIL}];   /* xy = grid position, z = weight */
uniform vec4 uFlips[${FLIPS}];            /* xy = cell, z = angle, w = active */
uniform float uGlow;                      /* spark falloff; tracks the cell size */

float hash21(vec2 p){
  p=fract(p*vec2(123.34,345.45));
  p+=dot(p,p+34.345);
  return fract(p.x*p.y);
}
float smoothNoise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  vec2 u=f*f*(3.0-2.0*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),
             mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);
}

/* distance to the two quarter-arcs of a Truchet tile; cell-local coords in [-0.5,0.5] */
float arcDist(vec2 f){
  return min(abs(length(f-vec2(-0.5,-0.5))-0.5),
             abs(length(f-vec2( 0.5, 0.5))-0.5));
}

void main(){
  vec2 g=vUv*uGrid;
  ivec2 id=ivec2(floor(g));
  vec2 f=fract(g)-0.5;
  float code=floor(texelFetch(uCells,id,0).r*255.0+0.5);

  /* a turning cell is drawn rotated; JS commits the new code when it lands */
  float ang=0.0;
  for(int k=0;k<${FLIPS};k++){
    if(uFlips[k].w>0.5 && int(uFlips[k].x)==id.x && int(uFlips[k].y)==id.y) ang=uFlips[k].z;
  }

  float d;
  if(code<0.5)      d=1e3;                 /* bare corner */
  else if(code<1.5) d=abs(f.x);            /* vertical comb */
  else if(code<2.5) d=abs(f.y);            /* horizontal comb */
  else{
    vec2 tf=f;
    if(code>3.5) tf.x=-tf.x;               /* the mirrored Truchet orientation */
    float ca=cos(ang), sa=sin(ang);
    tf=vec2(ca*tf.x-sa*tf.y, sa*tf.x+ca*tf.y);
    d=arcDist(tf);
  }

  /* Antialias from the derivative of the grid coords, not of d. d jumps at
     the seams where the wire code changes, so fwidth(d) explodes there and
     used to need clamping; g is smooth everywhere, so this is both correct
     at the seams and correct at any density. */
  float aa=max(fwidth(g.x),fwidth(g.y))*0.6;
  float w=0.050;
  /* at high density the stroke falls below a pixel; hold it at a hairline
     and take the weight back out of the brightness, so the weave thins
     instead of dissolving */
  float wEff=max(w,aa*0.9);
  float wgt=sqrt(w/wEff);
  float core=smoothstep(wEff+aa,wEff-aa,d)*wgt;
  float halo=smoothstep(wEff+0.14,wEff,d);
  float shade=smoothstep(wEff+0.075,wEff+0.005,d)*(1.0-core);

  /* warm ground */
  vec2 p=(vUv-0.5)*uRes/uRes.y;
  float rn=clamp(length(p*vec2(0.92,1.0))/0.72,0.0,1.0);
  vec3 col=mix(vec3(0.478,0.318,0.176),vec3(0.196,0.137,0.086),smoothstep(0.05,1.0,rn));

  /* the spark: a comet of trail samples, only evaluated on and around a wire */
  float spark=0.0;
  if(core+halo>0.002){
    for(int i=0;i<${SPARKS * TRAIL};i++){
      vec2 dp=g-uTrail[i].xy;
      spark=max(spark,uTrail[i].z*exp(-dot(dp,dp)*uGlow));
    }
  }

  vec3 trace=vec3(0.925,0.435,0.129);
  vec3 traceHot=vec3(1.0,0.72,0.40);
  float twinkle=0.5+0.5*sin(uTime*0.55+hash21(vec2(id))*6.283);

  /* the standing wave: a slow bloom breathing outward from the die, under the
     sparks. Held well below them so they stay the event and this stays weather. */
  float wave=fract(uTime*0.075-rn*1.35);
  float pulse=exp(-pow((wave-0.5)/0.16,2.0))*0.55;

  col=mix(col,col*0.62,shade);
  col=mix(col,trace,core*(0.84+0.07*twinkle));
  col+=trace*halo*(1.0-core)*0.10;
  col+=traceHot*core*pulse*(0.22+0.20*twinkle);           /* the wave passing */
  col+=trace*halo*pulse*0.09;
  col+=traceHot*core*spark*1.35;                          /* the wire lights up */
  col+=trace*halo*spark*0.60;                             /* bloom off the wire */
  col+=vec3(1.0,0.94,0.86)*core*pow(spark,3.0)*0.85;      /* white-hot head */

  /* fine film/paper grain */
  col*=0.955+0.06*smoothNoise(vUv*vec2(uRes.x/110.0,uRes.y/110.0));

  /* resting vignette, matching the original D7 plate falloff */
  col*=mix(1.0,0.55,smoothstep(0.42,1.0,clamp(length(p*vec2(0.9,1.0))/0.71,0.0,1.0)));

  outColor=vec4(col,1.0);
}`;

const canvas = $('#heroCanvas');
const plateFrame = $('#plateFrame');
let gl = null, prog = null, glOK = false;
const U = {};

/* ---- lattice state ---- */
let nx = 0, ny = 0;
let cells = null;          /* Uint8Array, row-major, row 0 at the bottom */
let cellTex = null;
let entries = [];          /* every border point a wire crosses */
let blockCells = [];       /* the Truchet cells, the only ones that turn */
let sparks = [];
let flips = [];
const trailBuf = new Float32Array(SPARKS * TRAIL * 3);
const flipBuf = new Float32Array(FLIPS * 4);

const codeAt = (i, j) => cells[j * nx + i];

function buildGrid(pxW, pxH) {
  const asp = pxW / pxH;
  setDensity(pxW, pxH);
  ny = Math.max(8, Math.round(cellCount / Math.min(asp, 1)));
  nx = Math.max(8, Math.round(ny * asp));
  let s = Math.max(3, Math.floor(BLOCK * cellCount));
  s = Math.min(s, ((nx / 2) | 0) - 1, ((ny / 2) | 0) - 1);
  const bx0 = ((nx / 2) | 0) - s, bx1 = bx0 + 2 * s - 1;
  const by0 = ((ny / 2) | 0) - s, by1 = by0 + 2 * s - 1;

  cells = new Uint8Array(nx * ny);
  blockCells = [];
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const inX = i >= bx0 && i <= bx1, inY = j >= by0 && j <= by1;
      let c = EMPTY;
      if (inX && inY) {
        c = Math.random() < 0.5 ? TRU_A : TRU_B;
        blockCells.push([i, j]);
      } else if (inX) c = VERT_C;
      else if (inY) c = HORZ_C;
      cells[j * nx + i] = c;
    }
  }

  /* every wire runs to the border; these are the points it crosses */
  entries = [];
  for (let i = bx0; i <= bx1; i++) {
    entries.push({i: i, j: 0, e: 2});
    entries.push({i: i, j: ny - 1, e: 0});
  }
  for (let j = by0; j <= by1; j++) {
    entries.push({i: 0, j: j, e: 3});
    entries.push({i: nx - 1, j: j, e: 1});
  }

  flipRate = FLIP_RATE * blockCells.length / 1000;
  uploadCells();
  sparks = [];
  for (let k = 0; k < SPARKS; k++) sparks.push(newSpark(k));
  flips = [];
}

function uploadCells() {
  if (!cellTex) {
    cellTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, cellTex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  gl.bindTexture(gl.TEXTURE_2D, cellTex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, nx, ny, 0, gl.RED, gl.UNSIGNED_BYTE, cells);
}

/* ---- spark traversal ---- */

/* the point at parameter t along a cell's wire, from entry edge to exit edge */
function wirePoint(entry, exit, t, out) {
  const a = MIDPT[entry], b = MIDPT[exit];
  if ((entry + exit) % 4 === 2) {          /* opposite edges: a straight run */
    out[0] = a[0] + (b[0] - a[0]) * t;
    out[1] = a[1] + (b[1] - a[1]) * t;
    return;
  }
  /* adjacent edges: a quarter arc about the corner the two edges share */
  const cx = (entry === 1 || exit === 1) ? 1 : 0;
  const cy = (entry === 0 || exit === 0) ? 1 : 0;
  const a0 = Math.atan2(a[1] - cy, a[0] - cx);
  let da = Math.atan2(b[1] - cy, b[0] - cx) - a0;
  if (da > Math.PI) da -= 2 * Math.PI;
  if (da < -Math.PI) da += 2 * Math.PI;
  const ang = a0 + da * t;
  out[0] = cx + 0.5 * Math.cos(ang);
  out[1] = cy + 0.5 * Math.sin(ang);
}

const _pt = [0, 0];
function sparkPos(sp) {
  if (sp.off >= 0) return [sp.x, sp.y];
  const ex = PAIR[codeAt(sp.i, sp.j)][sp.e];
  wirePoint(sp.e, ex, sp.t, _pt);
  return [sp.i + _pt[0], sp.j + _pt[1]];
}

/* Off the border the wire keeps going somewhere we cannot see. The model:
   it runs behind the plate and comes back in on the far side, in the same
   lane and heading the same way — so the spark drains its tail out of the
   frame, spends a moment out of view, and re-enters opposite. */
function leaveBoard(sp, exitEdge) {
  const m = MIDPT[exitEdge];
  sp.x = sp.i + m[0];
  sp.y = sp.j + m[1];
  sp.dir = STEP_D[exitEdge];
  sp.exitEdge = exitEdge;
  sp.off = 0;
  sp.offLim = TRAIL * TRAIL_STEP + 1.5 + Math.random() * 4;
}

function reenter(sp) {
  const e = sp.exitEdge;
  /* opposite border, same lane, still travelling the same way */
  if (e === 0)      placeSpark(sp, sp.i, 0, 2);
  else if (e === 2) placeSpark(sp, sp.i, ny - 1, 0);
  else if (e === 1) placeSpark(sp, 0, sp.j, 3);
  else              placeSpark(sp, nx - 1, sp.j, 1);
}

function placeSpark(sp, i, j, e) {
  sp.i = i; sp.j = j; sp.e = e; sp.t = 0; sp.off = -1;
  const p = sparkPos(sp);
  /* lay the tail back out through the border it just came in by */
  const d = STEP_D[e];
  sp.trail.length = 0;
  for (let k = 0; k < TRAIL; k++) sp.trail.push([p[0] - d[0] * k * TRAIL_STEP, p[1] - d[1] * k * TRAIL_STEP]);
  sp.lastX = p[0]; sp.lastY = p[1];
}

function newSpark(slot) {
  const sp = {i: 0, j: 0, e: 0, t: 0, off: -1, offLim: 0, x: 0, y: 0,
              dir: STEP_D[0], exitEdge: 0, trail: [], lastX: 0, lastY: 0};
  const en = entries[(Math.random() * entries.length) | 0];
  placeSpark(sp, en.i, en.j, en.e);
  /* start it out of view and stagger the run-in, so the fleet does not
     enter in lockstep. reenter() will drop it back on this same border. */
  sp.exitEdge = (en.e + 2) % 4;
  sp.dir = STEP_D[sp.exitEdge];
  sp.off = 0;
  sp.offLim = slot * 2.2 + Math.random() * 1.5;
  const m = MIDPT[en.e];
  sp.x = en.i + m[0] - sp.dir[0] * sp.offLim;
  sp.y = en.j + m[1] - sp.dir[1] * sp.offLim;
  sp.trail.length = 0;
  for (let k = 0; k < TRAIL; k++) {
    sp.trail.push([sp.x - sp.dir[0] * k * TRAIL_STEP, sp.y - sp.dir[1] * k * TRAIL_STEP]);
  }
  sp.lastX = sp.x; sp.lastY = sp.y;
  return sp;
}

function advance(sp, dt) {
  let dist = SPEED * dt;
  let guard = 0;
  while (dist > 1e-6 && guard++ < 64) {
    if (sp.off >= 0) {                        /* out of view behind the plate */
      const step = Math.min(dist, sp.offLim - sp.off);
      sp.off += step; dist -= step;
      sp.x += sp.dir[0] * step;
      sp.y += sp.dir[1] * step;
      if (sp.off >= sp.offLim - 1e-6) reenter(sp);
      continue;
    }
    const ex = PAIR[codeAt(sp.i, sp.j)][sp.e];
    if (ex < 0) { leaveBoard(sp, (sp.e + 2) % 4); continue; }
    const len = ((sp.e + ex) % 4 === 2) ? 1 : ARC_LEN;
    const step = Math.min(dist, (1 - sp.t) * len);
    sp.t += step / len; dist -= step;
    if (sp.t < 0.9999) break;
    const d = STEP_D[ex];
    const ni = sp.i + d[0], nj = sp.j + d[1];
    if (ni < 0 || nj < 0 || ni >= nx || nj >= ny || codeAt(ni, nj) === EMPTY) {
      leaveBoard(sp, ex);
    } else {
      sp.i = ni; sp.j = nj; sp.e = (ex + 2) % 4; sp.t = 0;
    }
  }
  /* sample the tail at a fixed spacing so the comet hugs the wire */
  const p = sparkPos(sp);
  const dx = p[0] - sp.lastX, dy = p[1] - sp.lastY;
  if (dx * dx + dy * dy >= TRAIL_STEP * TRAIL_STEP) {
    sp.trail.unshift([p[0], p[1]]);
    if (sp.trail.length > TRAIL) sp.trail.length = TRAIL;
    sp.lastX = p[0]; sp.lastY = p[1];
  } else {
    sp.trail[0] = [p[0], p[1]];
  }
}

/* ---- the woven block reconfigures: a cell turns a quarter-turn ---- */
function maybeFlip(dt) {
  for (let k = flips.length - 1; k >= 0; k--) {
    flips[k].t += dt / FLIP_TIME;
    if (flips[k].t >= 1) {
      const fl = flips[k];
      const idx = fl.j * nx + fl.i;
      cells[idx] = cells[idx] === TRU_A ? TRU_B : TRU_A;
      gl.bindTexture(gl.TEXTURE_2D, cellTex);
      gl.texSubImage2D(gl.TEXTURE_2D, 0, fl.i, fl.j, 1, 1, gl.RED, gl.UNSIGNED_BYTE,
                       cells.subarray(idx, idx + 1));
      flips.splice(k, 1);
    }
  }
  if (flips.length >= FLIPS || !blockCells.length || Math.random() > dt * flipRate) return;
  const c = blockCells[(Math.random() * blockCells.length) | 0];
  for (const fl of flips) if (fl.i === c[0] && fl.j === c[1]) return;
  /* never turn a cell a spark is about to run through: the drawn wire would
     stop agreeing with the path the spark is following */
  for (const sp of sparks) {
    if (sp.off >= 0) continue;
    if (Math.abs(sp.i - c[0]) + Math.abs(sp.j - c[1]) < 4 * scale) return;
  }
  flips.push({i: c[0], j: c[1], t: 0});
}

function packUniforms(alive) {
  trailBuf.fill(0);
  for (let s = 0; s < sparks.length; s++) {
    const tr = sparks[s].trail;
    for (let k = 0; k < TRAIL; k++) {
      const pt = tr[k];
      if (!pt) break;
      const o = (s * TRAIL + k) * 3;
      const fade = 1 - k / TRAIL;
      trailBuf[o] = pt[0];
      trailBuf[o + 1] = pt[1];
      trailBuf[o + 2] = alive ? fade * fade : 0;
    }
  }
  flipBuf.fill(0);
  for (let k = 0; k < flips.length && k < FLIPS; k++) {
    const x = flips[k].t, e = x * x * x * (x * (x * 6 - 15) + 10);   /* smootherstep */
    flipBuf[k * 4] = flips[k].i;
    flipBuf[k * 4 + 1] = flips[k].j;
    flipBuf[k * 4 + 2] = e * Math.PI / 2;
    flipBuf[k * 4 + 3] = 1;
  }
}

/* ---- renderer ---- */

/* the clock advances only while the plate is drawing, so a backgrounded tab
   resumes where it left off instead of jumping */
let clock = 0, lastTs = 0, rafId = 0;
let onScreen = true;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    const err = gl.getShaderInfoLog(s);
    gl.deleteShader(s);
    throw new Error('shader: ' + err);
  }
  return s;
}

function initGL() {
  gl = canvas.getContext('webgl2', {antialias: false, alpha: false, powerPreference: 'low-power'});
  if (!gl) throw new Error('no webgl2');
  const vs = compileShader(gl.VERTEX_SHADER, VERT);
  const fs = compileShader(gl.FRAGMENT_SHADER, FRAG);
  prog = gl.createProgram();
  gl.attachShader(prog, vs);
  gl.attachShader(prog, fs);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    throw new Error('link: ' + gl.getProgramInfoLog(prog));
  }
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  ['uRes','uGrid','uTime','uCells','uTrail','uFlips','uGlow'].forEach((n) => {
    U[n] = gl.getUniformLocation(prog, n);
  });
  cellTex = null;
  glOK = true;
}

let lastW = 0, lastH = 0;
function resizeCanvas(rect) {
  /* the weave is fine enough that the extra resolution is what keeps it
     legible rather than a luxury; 2 is the ceiling, not the display's own */
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, Math.round(rect.width * dpr));
  const h = Math.max(1, Math.round(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
  /* the grid is rebuilt only on a real shape change, not on every DPR frame */
  if (Math.abs(rect.width - lastW) > 0.5 || Math.abs(rect.height - lastH) > 0.5 || !cells) {
    lastW = rect.width; lastH = rect.height;
    buildGrid(rect.width, rect.height);
  }
}

function drawFrame() {
  if (!glOK) return;
  const rect = plateFrame.getBoundingClientRect();
  if (rect.width < 1 || rect.height < 1) return;
  resizeCanvas(rect);
  packUniforms(!reduceMotion.matches);
  gl.useProgram(prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, cellTex);
  gl.uniform1i(U['uCells'], 0);
  gl.uniform2f(U['uRes'], rect.width, rect.height);
  gl.uniform2f(U['uGrid'], nx, ny);
  gl.uniform1f(U['uTime'], clock);
  gl.uniform3fv(U['uTrail'], trailBuf);
  gl.uniform4fv(U['uFlips'], flipBuf);
  gl.uniform1f(U['uGlow'], GLOW);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

function tick(ts) {
  rafId = requestAnimationFrame(tick);
  /* clamp the step: a long pause (tab switch, sleep) must not warp the field */
  const dt = Math.min(ts - lastTs, 50) / 1000;
  lastTs = ts;
  clock += dt;
  if (cells) {
    for (const sp of sparks) advance(sp, dt);
    maybeFlip(dt);
  }
  drawFrame();
}

function running() {
  return glOK && onScreen && !document.hidden && !reduceMotion.matches;
}

function sync() {
  if (running()) {
    if (!rafId) { lastTs = performance.now(); rafId = requestAnimationFrame(tick); }
  } else {
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    drawFrame(); /* leave a correct still frame behind */
  }
}

/* ---- init ---- */
renderChrome();
renderMain();

try {
  if (document.documentElement.classList.contains('no-webgl')) throw new Error('no webgl2');
  initGL();
  plateFrame.classList.add('has-webgl');
  drawFrame();

  if (window.ResizeObserver) {
    new ResizeObserver(() => { if (!rafId) drawFrame(); }).observe(plateFrame);
  } else {
    window.addEventListener('resize', () => { if (!rafId) drawFrame(); });
  }
  if (window.IntersectionObserver) {
    new IntersectionObserver((es) => { onScreen = es[0].isIntersecting; sync(); },
                             {threshold: 0}).observe(plateFrame);
  }
  document.addEventListener('visibilitychange', sync);
  /* Safari <16.4 only supports the deprecated listener form */
  if (reduceMotion.addEventListener) reduceMotion.addEventListener('change', sync);
  else if (reduceMotion.addListener) reduceMotion.addListener(sync);

  /* a lost context (GPU reset, tab eviction) must not leave a black plate */
  canvas.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    glOK = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = 0; }
    plateFrame.classList.remove('has-webgl');
  });
  canvas.addEventListener('webglcontextrestored', () => {
    try { initGL(); cells = null; plateFrame.classList.add('has-webgl'); sync(); }
    catch (e) { /* keep the fallback */ }
  });

  sync();
} catch (e) {
  /* fallback gradient remains visible */
}
</script>
</body>
</html>
